<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSC স্টাডি ট্র্যাকার</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
color-scheme:light;--bg:#eef8f2;--card:#fff;--tx:#1f2d25;--mut:#5b6b61;--bd:#d6e6db;--pri:#15803d;--ok:#16a34a;--must:#14532d;--rep:#15803d;--imp:#0f766e;--low:#4d7c0f;--chip:#e1f2e8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#e6f7ec 0%,#d3f0de 45%,#f3fcf6 100%) fixed;color:var(--tx);font-family:'Hind Siliguri',system-ui,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:4px 2px 12px}
.hero{background:linear-gradient(135deg,#16a34a,#14532d);color:#fff;border-radius:18px;padding:16px}
.hero{display:flex;align-items:center;gap:14px;padding:18px}.hero .info{flex:1;min-width:0}.hero .ov{font-size:15px;font-weight:600;margin:6px 0 10px}.hero .cnt{font-size:34px;font-weight:700;line-height:1.1}.donut{position:relative;width:120px;height:120px;flex:none}.donut svg{width:100%;height:100%}.donut b{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:700}
.hero .big{font-size:38px;font-weight:700;line-height:1}
.hero small{opacity:.85}
.bar{height:8px;background:rgba(127,127,127,.22);border-radius:99px;overflow:hidden}
.hero .bar{background:rgba(255,255,255,.28);margin-top:12px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.hero .bar i{background:#fff}
.scroll{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;background:var(--chip);padding:4px;border-radius:14px}
.tab{border:0;background:none;color:var(--mut);font:600 12.5px 'Hind Siliguri',sans-serif;padding:9px 2px;border-radius:11px;cursor:pointer;line-height:1.2}
.tab.on{background:var(--card);color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:500 13.5px 'Hind Siliguri',sans-serif;padding:7px 13px;border-radius:99px;cursor:pointer;white-space:nowrap}
.chip svg{width:15px;height:15px;vertical-align:-2px;margin-right:6px}.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip em{font-style:normal;opacity:.75;font-size:12px;margin-left:4px}
.lbl{font-size:12px;color:var(--mut);margin:14px 2px 0;font-weight:600}
.sh{font-weight:700;font-size:16px;margin:20px 2px 8px;display:flex;justify-content:space-between}
.sh span{color:var(--mut);font-weight:500;font-size:13px}
.ch{background:var(--card);border:1px solid color-mix(in srgb,var(--c) 40%,#fff);border-radius:14px;margin-bottom:12px;overflow:hidden}
.chh{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;background:color-mix(in srgb,var(--c) 26%,#fff)}
.chh .t{flex:1;min-width:0}
.chh .n{font-weight:700;font-size:16.5px;line-height:1.3}
.chh .m{font-size:12px;color:var(--mut);margin-top:2px}
.chh .bar{height:5px;margin-top:7px}
.arr{color:var(--mut);transition:transform .2s;font-size:12px}
.ch.open .arr{transform:rotate(90deg)}
.body{display:none;border-top:1px solid color-mix(in srgb,var(--c) 30%,#fff);background:color-mix(in srgb,var(--c) 8%,#fff);padding:10px 12px 12px}
.ch.open .body{display:block}
.bh{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px}.tl{font-size:12.5px;font-weight:700;color:var(--mut);letter-spacing:.3px}.all{border:0;background:none;color:var(--pri);font:600 12.5px 'Hind Siliguri',sans-serif;padding:4px 0;cursor:pointer}
.tp{display:flex;align-items:center;gap:11px;padding:11px 12px;cursor:pointer;background:#fff;border:1px solid color-mix(in srgb,var(--c) 22%,#fff);border-radius:12px}
.tp+.tp{margin-top:8px}
.cb{flex:none;width:24px;height:24px;border:2px solid var(--bd);border-radius:7px;display:grid;place-items:center;color:transparent;font-size:15px;font-weight:700;transition:.15s}
.tp.done .cb{background:var(--ok);border-color:var(--ok);color:#fff}
.tp .tx{flex:1;min-width:0}
.tp .nm{font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tg{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.tg.must{color:#fff;background:var(--must);border-color:var(--must)}.tg.mid{color:var(--rep);background:#dcfce7}.tg.low{color:var(--low);background:#f1f8e4}.tg.imp{color:var(--imp)}.tg.med{color:#0f766e;background:#d7f3ee}.tg.eng{color:#0369a1;background:#def1fb}.tg.uni{color:#6b46c1;background:#ece7fb}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}.chip.on .dot{box-shadow:0 0 0 1.5px #fff}
.yt{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--chip)}
.yt svg{width:22px;height:22px}
.yt.off{opacity:.35;pointer-events:none;filter:grayscale(1)}
.mdl{position:fixed;inset:0;background:rgba(15,40,25,.5);display:grid;place-items:center;padding:20px;z-index:50}
.mdl[hidden]{display:none}
.mdl .box{background:var(--card);border-radius:18px;padding:22px 20px 18px;width:100%;max-width:320px;box-shadow:0 12px 40px rgba(0,0,0,.25);text-align:center}
.mdl .q{font-size:17px;font-weight:700;margin-bottom:16px}
.mdl .btns{display:flex;gap:10px}
.mdl button{flex:1;padding:11px 0;border-radius:12px;border:1px solid var(--bd);font:inherit;font-weight:600;font-size:15px;cursor:pointer;background:var(--chip);color:var(--pri)}
.mdl button.y{background:var(--pri);border-color:var(--pri);color:#fff}
.empty{text-align:center;color:var(--mut);padding:40px 10px}

/* ===== সফট শ্যাডো ও স্মুথ ট্রানজিশন ===== */
.hero{box-shadow:0 10px 26px rgba(20,83,45,.22)}
.box,.shero,.ch{box-shadow:0 2px 10px rgba(21,128,61,.08)}
.grid .box{transition:transform .18s ease,box-shadow .2s ease}
.tab{transition:background .2s,color .2s,box-shadow .2s}
.chip{transition:background .2s,color .2s,border-color .2s,transform .12s}
.chip:active{transform:scale(.95)}
.tp{transition:background .2s,border-color .2s,transform .12s}
.tp:active{transform:scale(.985)}
.tp.done{background:#f4fbf6}
.chh{transition:background .2s}
.yt{transition:transform .15s,background .2s}
.yt:active{transform:scale(.88)}
.mdl button{transition:transform .12s,filter .15s}
.mdl button:active{transform:scale(.96)}
@media (hover:hover){
  .grid .box:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(21,128,61,.16)}
  .tp:hover{border-color:color-mix(in srgb,var(--c) 45%,#fff)}
  .yt:hover{transform:scale(1.08);background:#fde2e2}
  .chip:hover{border-color:var(--pri)}
}

/* ===== এনিমেশন ===== */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes grow{from{width:0}}
@keyframes dash{from{stroke-dasharray:0 314.16}}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}}
@keyframes arrOn{from{transform:rotate(0)}}
@keyframes arrOff{from{transform:rotate(90deg)}}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}}
@keyframes mpop{from{opacity:0;transform:translateY(12px) scale(.94)}}
.fx-page>*:not(.grid){animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards}
.fx-page>*:nth-child(2){animation-delay:.05s}.fx-page>*:nth-child(3){animation-delay:.1s}.fx-page>*:nth-child(4){animation-delay:.15s}
.fx-page>*:nth-child(5){animation-delay:.2s}.fx-page>*:nth-child(6){animation-delay:.24s}.fx-page>*:nth-child(7){animation-delay:.28s}
.fx-page>*:nth-child(n+8){animation-delay:.32s}
.fx-page .grid .box{animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(160ms + min(var(--i,0),12)*35ms)}
.fx-list .grid .box,.fx-list .ch{animation:rise .38s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(min(var(--i,0),10)*35ms)}
.fx-page .bar i,.fx-list .bar i{animation:grow .8s cubic-bezier(.2,.8,.2,1) .15s backwards}
.fx-page .donut circle:last-of-type,.fx-list .donut circle:last-of-type{animation:dash 1s cubic-bezier(.2,.8,.2,1) .1s backwards}
.ch.just.open .body{animation:slide .28s ease backwards}
.ch.just.open .arr{animation:arrOn .25s ease}
.ch.just:not(.open) .arr{animation:arrOff .25s ease}
.tp.pop.done .cb{animation:pop .35s ease}
.mdl:not([hidden]){animation:fade .2s ease}
.mdl:not([hidden]) .box{animation:mpop .25s cubic-bezier(.2,.9,.3,1.15)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;cursor:pointer;text-align:left;font-family:inherit;color:var(--tx);position:relative;overflow:hidden}
.box:active{transform:scale(.98)}
.ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--c) 15%,transparent)}
.box .nm{font-weight:700;font-size:16px;margin:10px 0 2px}
.box .sm{font-size:12px;color:var(--mut)}
.box .pc{font-size:22px;font-weight:700;color:var(--c);margin-top:6px}
.box .bar i{background:var(--c)}
.box .bar{margin-top:6px}
.back{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:6px;border:0;background:var(--bg);color:var(--pri);font:600 15px 'Hind Siliguri',sans-serif;padding:10px 0;cursor:pointer;width:100%}
.shero{margin-top:6px;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px}
.shero .t{flex:1}.shero .nm{font-size:20px;font-weight:700}.shero .bar i{background:var(--c)}
.num{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--chip);color:var(--pri);font-weight:700;font-size:13px}
.chh .bar i{background:var(--c)}
</style>
</head>

<div class="wrap" id="app"></div>

<script>

/* ====== অ্যাপ ====== */
const CATS=[['ac','একাডেমিক সিলেবাস','একাডেমিক<br>সিলেবাস'],['med','গুরুত্বপূর্ণ টপিক মেডিকেল এডমিশন','গুরুত্বপূর্ণ টপিক<br>মেডিকেল<br>এডমিশন'],['eng','গুরুত্বপূর্ণ টপিক ইঞ্জিনিয়ারিং এডমিশন','গুরুত্বপূর্ণ টপিক<br>ইঞ্জিনিয়ারিং<br>এডমিশন'],['uni','গুরুত্বপূর্ণ টপিক ভার্সিটি এডমিশন','গুরুত্বপূর্ণ টপিক<br>ভার্সিটি<br>এডমিশন']];
const IC=b=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+b+'</svg>';
const FLT=[['all','সব'],['must','Must','#14532d'],['mid','Medium','#16a34a'],['low','Low','#84cc16']];
const IMPIC=IC('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>');
const TAGN={must:'Must',mid:'Medium',low:'Low',imp:'এডমিশন',med:'মেডিকেল',eng:'ইঞ্জিনিয়ারিং',uni:'ভার্সিটি'};
const YT='<svg viewBox="0 0 24 24"><rect x="1" y="5" width="22" height="14" rx="4" fill="#ff0000"/><path d="M10 9l5 3-5 3z" fill="#fff"/></svg>';
let fx='page',just=null,popKey=null;
let cat='ac',flt='all',adm=false,view=location.hash.slice(1)||null,open=new Set(),done={};
try{localStorage.removeItem('hsc-done')}catch(e){}
try{done=JSON.parse(localStorage.getItem('hsc-done-v2')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('hsc-done-v2',JSON.stringify(done))}catch(e){}};
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const key=(s,c,t)=>s.id+'|'+c.name+'|'+t.n;
const pct=(d,t)=>t?Math.round(d/t*100):0;
const fm=n=>bn(Number.isInteger(+n.toFixed(1))?Math.round(n):n.toFixed(1));
const vis=(t,s)=>cat==='ac'?(!view||s.nofilter||((flt==='all'||t.tags.includes(flt))&&(!adm||t.tags.some(g=>g==='med'||g==='eng'||g==='uni')))):t.tags.includes(cat);
const $=id=>document.getElementById(id);
const filters=()=>cat==='ac'?`<div class="lbl">বোর্ড পরীক্ষায় গুরুত্ব</div><div class="scroll" style="padding-top:6px">${FLT.map(f=>`<button class="chip ${f[0]===flt?'on':''}" data-a="flt" data-v="${f[0]}">${f[2]?`<i class="dot" style="background:${f[2]}"></i>`:''}${f[1]}</button>`).join('')}</div><div class="lbl" style="margin-top:4px">এডমিশন</div><div class="scroll" style="padding-top:6px"><button class="chip ${adm?'on':''}" data-a="adm">${IMPIC}এডমিশনে গুরুত্বপূর্ণ</button></div>${adm?'<div class="lbl" style="margin-top:8px;font-weight:500">প্রতিটি টপিকের নিচের ট্যাগে দেখুন সেটি কোন কোন এডমিশনের জন্য গুরুত্বপূর্ণ</div>':''}`:'';
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;

function model(){
  return DATA.map((s,si)=>{
    const ch=s.chapters.map((c,ci)=>({c,ci,ts:c.topics.map((t,ti)=>({t,ti})).filter(x=>vis(x.t,s))})).filter(x=>x.ch!==0&&x.ts.length);
    /* গ্রুপ ওজন: s.gp দিয়ে শুরু হওয়া অধ্যায়গুলোর সব টপিক মিলে % হিসাবে s.gw টি টপিকের সমান */
    const isG=c=>!!(s.gp&&s.gw&&c.c.name.startsWith(s.gp));
    let nG=0;ch.forEach(c=>{if(isG(c))nG+=c.ts.length});
    let tot=0,dn=0,wt=0,wd=0;
    ch.forEach(c=>{const w=isG(c)?s.gw/nG:1;c.ts.forEach(y=>{tot++;wt+=w;if(done[key(s,c.c,y.t)]){dn++;wd+=w}})});
    return{s,si,ch,tot,dn,wt,wd};
  }).filter(x=>x.tot||(cat==='ac'&&(!x.s.chapters.length||x.s.id===view)));
}

function render(){
  const subs=model();
  if(view&&!subs.some(x=>x.s.id===view)){view=null}
  const app=$('app');
  app.className='wrap'+(fx?' fx-'+fx:'');fx='';
  if(!view){
    let D=0,T=0;subs.forEach(x=>{D+=x.wd;T+=x.wt});
    const cn=CATS.find(c=>c[0]===cat)[1];
    app.innerHTML=`<h1>HSC স্টাডি ট্র্যাকার</h1>
    <div class="hero"><div class="info"><small>${cn}</small><div class="ov">Overall chapter complete</div><div class="cnt">${fm(D)} / ${fm(T)}</div><small>টপিক সম্পন্ন</small></div><div class="donut"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="13"/><circle cx="60" cy="60" r="50" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-dasharray="${(pct(D,T)*3.1416).toFixed(1)} 314.16" transform="rotate(-90 60 60)"/></svg><b>${bn(pct(D,T))}%</b></div></div>
    <div class="tabs">${CATS.map(c=>`<button class="tab ${c[0]===cat?'on':''}" data-a="cat" data-v="${c[0]}">${c[2]}</button>`).join('')}</div>
    <div class="lbl">বিষয়সমূহ</div>
    ${subs.length?`<div class="grid">${subs.map((x,n)=>{const p=pct(x.wd,x.wt);return`<button class="box" style="--c:${x.s.color||'#15803d'};--i:${n}" data-a="go" data-v="${x.s.id}"><div class="ic">${x.s.icon||'📘'}</div><div class="nm">${x.s.name}</div><div class="sm">${x.tot?bn(x.ch.length)+'টি অধ্যায় · '+fm(x.wd)+'/'+fm(x.wt)+' টপিক':'শীঘ্রই যোগ হবে'}</div><div class="pc">${bn(p)}%</div>${bar(p)}</button>`}).join('')}</div>`:'<div class="empty">এই ফিল্টারে কোনো টপিক নেই</div>'}`;
    just=popKey=null;return;
  }
  const x=subs.find(y=>y.s.id===view),p=pct(x.wd,x.wt);
  app.innerHTML=`<div class="shero" style="--c:${x.s.color||'#15803d'}"><div class="ic" style="--c:${x.s.color||'#15803d'}">${x.s.icon||'📘'}</div><div class="t"><div class="nm">${x.s.name}</div><div class="sm" style="color:var(--mut);font-size:13px">${bn(x.dn)}/${bn(x.tot)} টপিক সম্পন্ন · ${bn(p)}%</div>${bar(p)}</div></div>
  ${x.s.nofilter||!x.s.chapters.length?'':filters()}
  <div class="sh">অধ্যায়সমূহ<span>${bn(x.ch.length)}টি</span></div>`+(x.ch.length?x.ch:[]).map((c,n)=>{
    const ids=c.ts.map(y=>key(x.s,c.c,y.t)),dn=ids.filter(k=>done[k]).length,o=open.has(x.si+'-'+c.ci);
    return`<div class="ch ${o?'open':''}${just===x.si+'-'+c.ci?' just':''}" style="--c:${x.s.color||'#15803d'};--i:${n}"><div class="chh" data-a="open" data-v="${x.si}-${c.ci}"><div class="num">${bn(c.ci+1)}</div><div class="t"><div class="n">${c.c.name}</div><div class="m">${bn(dn)}/${bn(ids.length)} টপিক · ${bn(pct(dn,ids.length))}%</div>${bar(pct(dn,ids.length))}</div><span class="arr">▶</span></div>
    <div class="body"><div class="bh"><span class="tl">টপিকসমূহ · ${bn(ids.length)}টি</span><button class="all" data-a="all" data-s="${x.si}" data-c="${c.ci}">${dn===ids.length?'সব আনমার্ক করুন':'✓ সব সম্পন্ন করুন'}</button></div>`+
    c.ts.map(y=>{const k=key(x.s,c.c,y.t),tg=x.s.nofilter?[]:['must','mid','low'].concat(adm?['med','eng','uni']:[]).filter(g=>y.t.tags.includes(g));
      return`<div class="tp ${done[k]?'done':''}${popKey===k?' pop':''}" data-a="tog" data-s="${x.si}" data-c="${c.ci}" data-t="${y.ti}"><div class="cb">✓</div><div class="tx"><div class="nm">${y.t.n}</div>${tg.length?`<div class="tags">${tg.map(g=>`<span class="tg ${g}">${TAGN[g]}</span>`).join('')}</div>`:''}</div><a class="yt ${y.t.u?'':'off'}" ${y.t.u?`href="${y.t.u}" target="_blank" rel="noopener"`:''} aria-label="ভিডিও দেখুন">${YT}</a></div>`}).join('')+`</div></div>`}).join('')+(x.ch.length?'':'<div class="empty">'+(x.s.chapters.length?'এই ফিল্টারে কোনো টপিক নেই':'এই বিষয়ে এখনো কোনো অধ্যায় যোগ করা হয়নি')+'</div>');
  just=popKey=null;
}
function resetFlt(){flt='all';adm=false}
function go(v){fx='page';open.clear();resetFlt();view=v;try{location.hash=v?'#'+v:''}catch(e){}render();window.scrollTo(0,0)}
addEventListener('hashchange',()=>{const nv=location.hash.slice(1)||null;if(nv!==view){open.clear();resetFlt();view=nv;fx='page';render()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(flt!=='all'||adm)){resetFlt();render()}});
addEventListener('pagehide',resetFlt);
function smooth(pb){const n=document.querySelectorAll('.bar i');if(n.length!==pb.length)return;const to=[...n].map(i=>i.style.width);n.forEach((i,k)=>{i.style.width=pb[k]});void document.body.offsetWidth;n.forEach((i,k)=>{i.style.width=to[k]})}
let ytUrl=null;
function closeYt(){ytUrl=null;document.getElementById('ytm').hidden=true}
addEventListener('keydown',e=>{if(e.key==='Escape')closeYt()});
document.addEventListener('click',e=>{
  const mb=e.target.closest('[data-m]');
  if(mb||e.target.id==='ytm'){const u=ytUrl;closeYt();if(mb&&mb.dataset.m==='yes'&&u){const l=document.createElement('a');l.href=u;l.target='_blank';l.rel='noopener';document.body.appendChild(l);l.click();l.remove()}return}
  const yl=e.target.closest('a.yt');
  if(yl){e.preventDefault();if(yl.getAttribute('href')){ytUrl=yl.href;document.getElementById('ytm').hidden=false}return}
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  const pb=[...document.querySelectorAll('.bar i')].map(i=>i.style.width);
  if(a==='go')return go(v);
  if(a==='back')return go(null);
  if(a==='cat'){cat=v;fx='list'}
  else if(a==='flt'){flt=v;fx='list'}
  else if(a==='adm'){adm=!adm;fx='list'}
  else if(a==='open'){open.has(v)?open.delete(v):open.add(v);just=v}
  else if(a==='tog'){const s=DATA[+el.dataset.s],c=s.chapters[+el.dataset.c],k=key(s,c,c.topics[+el.dataset.t]);done[k]?delete done[k]:(done[k]=1,popKey=k);save()}
  else if(a==='all'){const s=DATA[+el.dataset.s],c=s.chapters[+el.dataset.c],ks=c.topics.filter(t=>vis(t,s)).map(t=>key(s,c,t)),all=ks.every(k=>done[k]);ks.forEach(k=>all?delete done[k]:done[k]=1);save()}
  render();
  if(a==='tog'||a==='all')smooth(pb);
});
render();
</script>
</body>
</html>
